<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Большое приключение Милы</title>
<style>
:root{--panel:rgba(255,252,245,.96);--text:#2c2246;--shadow:0 10px 28px rgba(20,12,46,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;padding:0;width:100%;height:100dvh;overflow:hidden;font-family:'Segoe UI','Nunito',system-ui,sans-serif;background:radial-gradient(circle at top,#3b2d6f,#1b1636);color:var(--text)}
#app{width:100%;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:12px;overflow-y:auto}
.screen.active{display:flex}
#title-screen{background:linear-gradient(180deg,#6ec6ff 0%,#a8e6ff 45%,#fff0c2 75%,#8be08b 100%)}
.card{background:var(--panel);border-radius:26px;padding:22px;max-width:620px;width:100%;box-shadow:var(--shadow),0 0 0 5px rgba(255,255,255,.6);text-align:center}
.portraits{display:flex;justify-content:center;gap:10px;margin-bottom:8px}
.p-badge{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#fff5d6,#ffd6e7);border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.15);overflow:hidden;flex-shrink:0}
.p-badge.main{width:82px;height:82px;transform:translateY(-5px);border-color:#ff8fab}
.logo{font-size:clamp(22px,4.5vw,33px);font-weight:900;margin:4px 0 6px;background:linear-gradient(90deg,#ff5e8e,#ff9933,#2ec4b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:clamp(13px,2.2vw,15.5px);color:#5b4e7c;margin:0 0 15px;line-height:1.4}
.lang-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.lang-btn{border:3px solid #e6def5;background:#fff;border-radius:14px;padding:8px 14px;font-size:14px;font-weight:800;cursor:pointer;color:var(--text)}
.lang-btn.active{background:#fff4d9;border-color:#ff7b9c;box-shadow:0 4px 10px rgba(255,107,139,.25)}
.btn1{background:linear-gradient(180deg,#ff7a98,#f24c7c);color:#fff;border:none;border-radius:16px;padding:13px 30px;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #c12d58,0 8px 20px rgba(242,76,124,.35)}
.btn1:active{transform:translateY(3px);box-shadow:0 2px 0 #c12d58}
.btn2{background:linear-gradient(180deg,#4fd1c5,#2ba89d);color:#fff;border:none;border-radius:13px;padding:10px 18px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #1e7f76}
.btn2:active{transform:translateY(2px);box-shadow:0 2px 0 #1e7f76}
#map-screen{background:linear-gradient(180deg,#5cc4ff,#98e6a8);justify-content:flex-start}
.map-head{width:100%;max-width:1020px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);padding:10px 14px;border-radius:16px;box-shadow:var(--shadow);margin-bottom:10px;flex-wrap:wrap}
.map-grid{width:100%;max-width:1020px;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;padding-bottom:20px}
.sbtn{border:2px solid #dfd7f2;background:#fff;color:var(--text);border-radius:11px;padding:5px 10px;font-weight:800;font-size:13px;cursor:pointer}
.loc-card{background:var(--panel);border-radius:16px;padding:10px;cursor:pointer;box-shadow:0 5px 15px rgba(25,20,60,.16);border:3px solid #fff;display:flex;flex-direction:column;gap:5px;transition:.15s}
.loc-card:hover:not(.locked){transform:translateY(-3px);border-color:#ff7a98}
.loc-card.locked{opacity:.6;filter:grayscale(.55);cursor:not-allowed}
.loc-card.done{border-color:#2ec4b6}
.loc-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ff7a98,#ffb84d);color:#fff;font-weight:900;font-size:12px}
#game-screen{display:none;flex-direction:column;width:100%;height:100dvh;position:relative;z-index:5}
#game-screen.active{display:flex}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:6px 9px;background:rgba(25,18,52,.94);color:#fff;border-bottom:2px solid rgba(255,255,255,.12);flex-shrink:0;z-index:10;flex-wrap:wrap}
.hud-g{display:flex;align-items:center;gap:5px}
.pill,.hbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.24);border-radius:10px;padding:4px 8px;font-size:13px;font-weight:800;color:#fff;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.hbtn{cursor:pointer}
.hbtn.hint{background:linear-gradient(180deg,#ffcf56,#f59e0b);color:#3a1f00;border-color:#ffe28a}
.hbtn.hint:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.7)}
.loc-ttl{font-weight:900;font-size:14px;color:#ffe699;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage{flex:1;position:relative;overflow:hidden;background:#16122c;touch-action:none;display:flex;align-items:center;justify-content:center}
#vp{width:100%;height:100%;display:flex;align-items:center;justify-content:center;transform-origin:center center;will-change:transform}
#svg{width:100%;height:100%;max-width:100%;max-height:100%;display:block}
.h-item{cursor:pointer}
.h-item.found{pointer-events:none;animation:popF .5s ease-out forwards}
@keyframes popF{0%{opacity:1;filter:drop-shadow(0 0 12px #fff)}50%{opacity:1;filter:drop-shadow(0 0 22px #ffe066)}100%{opacity:0}}
.hud-bot{background:rgba(255,251,244,.97);border-top:3px solid #ffd599;padding:6px 8px;display:flex;align-items:center;justify-content:center;gap:6px;overflow-x:auto;flex-shrink:0;z-index:10}
.chip{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:12px;background:#fff;border:2px solid #e4dbf5;font-size:12.5px;font-weight:800;color:var(--text);white-space:nowrap;flex-shrink:0}
.chip.found{background:#dffaf0;border-color:#2ec4b6;color:#197a70;opacity:.62;text-decoration:line-through}
.c-ico{width:24px;height:24px;flex-shrink:0}
#toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(35,24,68,.92);color:#fff;padding:7px 16px;border-radius:18px;font-weight:800;font-size:13.5px;pointer-events:none;opacity:0;transition:.22s;z-index:30;border:2px solid #ffb84d;text-align:center}
#toast.show{opacity:1}
.modal{position:absolute;inset:0;background:rgba(18,12,42,.68);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:40;padding:12px}
.modal.active{display:flex}
.dbox{background:var(--panel);border-radius:22px;max-width:580px;width:100%;padding:18px;box-shadow:var(--shadow),0 0 0 4px #ffd599;display:flex;flex-direction:column;gap:12px}
.drow{display:flex;align-items:center;gap:12px}
.dav{width:82px;height:82px;border-radius:50%;border:4px solid #ff9bb3;background:#fff5dc;flex-shrink:0;overflow:hidden}
.dspk{font-weight:900;font-size:15.5px;color:#e84574;margin-bottom:3px}
.dtxt{font-size:15px;line-height:1.4;color:var(--text);font-weight:600}
.dfoot{display:flex;justify-content:space-between;align-items:center}
.stats{display:flex;justify-content:center;gap:14px;background:#f6f1ff;padding:9px;border-radius:12px;font-weight:800;font-size:14px}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes pend{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes swim{0%,100%{transform:translateX(0)}50%{transform:translateX(46px)}}
@keyframes steam{0%{transform:translateY(0) scale(.8);opacity:0}30%{opacity:.85}100%{transform:translateY(-36px) scale(1.4);opacity:0}}
@keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
@keyframes scr{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes cld{0%,100%{transform:translateX(-16px)}50%{transform:translateX(22px)}}
@keyframes flt{0%,100%{transform:translate(0,0)}33%{transform:translate(22px,-14px)}66%{transform:translate(38px,6px)}}
@keyframes beam{0%,100%{transform:rotate(-16deg);opacity:.3}50%{transform:rotate(16deg);opacity:.65}}
@keyframes hp{0%{transform:scale(.6);opacity:1}80%{transform:scale(1.5);opacity:.3}100%{transform:scale(1.7);opacity:0}}
.a-sf{animation:spin 1.1s linear infinite}.a-sm{animation:spin 4.5s linear infinite}.a-ss{animation:spin 13s linear infinite}
.a-sw{animation:sway 3s ease-in-out infinite}.a-pd{animation:pend 1.8s ease-in-out infinite}.a-bb{animation:bob 2.3s ease-in-out infinite}
.a-xm{animation:swim 5.5s ease-in-out infinite}.a-st{animation:steam 2s ease-out infinite}.a-st2{animation:steam 2s ease-out 1s infinite}
.a-gl{animation:glow 1.5s ease-in-out infinite}.a-wv{animation:wave 1.4s ease-in-out infinite}.a-sc{animation:scr 2s ease-in-out infinite}
.a-cl{animation:cld 9s ease-in-out infinite}.a-fl{animation:flt 5s ease-in-out infinite}.a-bm{animation:beam 4.5s ease-in-out infinite}
.hring{animation:hp 1.1s ease-out infinite;transform-box:fill-box;transform-origin:center}
@media(max-width:700px){.loc-ttl{display:none}.dav{width:64px;height:64px}.dtxt{font-size:13.5px}.hud-bot{justify-content:flex-start}.pill,.hbtn{font-size:12px;padding:4px 6px}}
</style>
</head>
<body>
<div id="app">
  <div id="title-screen" class="screen active">
    <div class="card">
      <div class="portraits" id="t-ports"></div>
      <h1 class="logo" id="u-title"></h1>
      <p class="sub" id="u-sub"></p>
      <div class="lang-row">
        <button class="lang-btn" data-l="ru" onclick="setLang('ru')">🇷🇺 Русский</button>
        <button class="lang-btn" data-l="uk" onclick="setLang('uk')">🇺🇦 Українська</button>
        <button class="lang-btn" data-l="sk" onclick="setLang('sk')">🇸🇰 Slovenčina</button>
      </div>
      <button class="btn1" id="u-play" onclick="goMap()"></button>
    </div>
  </div>

  <div id="map-screen" class="screen">
    <div class="map-head">
      <b style="font-size:18px" id="u-mapt"></b>
      <div class="hud-g">
        <span class="sbtn" id="u-stars">⭐ 0/45</span>
        <button class="sbtn" id="u-unlk" onclick="unlockAll()"></button>
        <button class="sbtn" onclick="cycleLang()">🌐 <span id="u-lc">RU</span></button>
        <button class="sbtn" id="u-msnd" onclick="toggleAudio()">🔊</button>
      </div>
    </div>
    <div class="map-grid" id="map-grid"></div>
  </div>

  <div id="game-screen">
    <div class="hud-top">
      <div class="hud-g">
        <button class="hbtn" onclick="openMap()">🗺️ <span id="u-bmap"></span></button>
        <span class="loc-ttl" id="h-title"></span>
      </div>
      <div class="hud-g">
        <span class="pill">⏱️ <span id="h-time">00:00</span></span>
        <span class="pill">🔍 <span id="h-fnd">0/6</span></span>
        <button class="hbtn hint" id="b-hint" onclick="useHint()">💡 <span id="h-hnt">3</span></button>
        <button class="hbtn" onclick="zStep(-.35)">−</button>
        <button class="hbtn" onclick="zStep(.35)">+</button>
        <button class="hbtn" onclick="resetV()">↺</button>
        <button class="hbtn" id="b-snd" onclick="toggleAudio()">🔊</button>
        <button class="hbtn" onclick="cycleLang()">🌐</button>
      </div>
    </div>
    <div class="stage" id="stage">
      <div id="vp"><svg id="svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div id="toast"></div>
    </div>
    <div class="hud-bot" id="tray"></div>

    <div class="modal" id="d-mod">
      <div class="dbox">
        <div class="drow">
          <div class="dav" id="d-av"></div>
          <div><div class="dspk" id="d-spk"></div><div class="dtxt" id="d-txt"></div></div>
        </div>
        <div class="dfoot">
          <span style="font-size:12px;color:#8c7db0;font-weight:800" id="d-dot"></span>
          <button class="btn1" id="d-nxt" onclick="nextDlg()"></button>
        </div>
      </div>
    </div>

    <div class="modal" id="w-mod">
      <div class="dbox" style="text-align:center">
        <div id="w-ports" style="display:flex;justify-content:center;gap:8px"></div>
        <h2 style="margin:0;color:#e84574" id="w-head"></h2>
        <div style="font-size:38px;letter-spacing:5px" id="w-st"></div>
        <div class="dtxt" id="w-out" style="font-style:italic"></div>
        <div class="stats"><span id="w-tm"></span><span id="w-hn"></span></div>
        <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap">
          <button class="btn2" id="w-mp" onclick="openMap()"></button>
          <button class="btn2" id="w-rp" onclick="loadScene(CUR)"></button>
          <button class="btn1" id="w-nx" onclick="nextSc()"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// === 1. UI TEXTS (RU / UK / SK) ===
let L=localStorage.getItem('mila_l')||'ru';
const U={
 ru:{t:'Большое приключение Милы',s:'Помоги Миле, маме Лизе, папе Саше и братику Мише найти все спрятанные вещи на 15 ярких локациях и успеть на Большой семейный праздник!',p:'▶ Начать приключение',mt:'🗺️ Карта приключения (15 локаций)',bm:'Карта',ul:'🔓 Открыть все',ult:'Все 15 локаций открыты!',nx:'Дальше ➜',go:'🔍 Искать предметы!',wh:'Отличная работа!',fh:'🎉 С праздником, любимая семья!',rp:'↺ Ещё раз',nl:'Дальше ➜',fn:'🏆 На карту',tl:'Время',hl:'Подсказки',fd:'Найдено:',nh:'Подсказки закончились!',sl:'Не спеши, присмотрись! 👀',hu:'Золотой лучик указывает путь! ✨',lk:'Сначала пройди предыдущую локацию!',bs:'Рекорд',sp:{mila:'Мила',liza:'Мама Лиза',sasha:'Папа Саша',misha:'Миша'}},
 uk:{t:'Велика пригода Міли',s:'Допоможи Мілі, мамі Лізі, татові Саші та братику Міші знайти всі заховані речі на 15 яскравих локаціях і встигнути на Велике сімейне свято!',p:'▶ Почати пригоду',mt:'🗺️ Карта пригоди (15 локацій)',bm:'Карта',ul:'🔓 Відкрити всі',ult:'Усі 15 локацій відкрито!',nx:'Далі ➜',go:'🔍 Шукати предмети!',wh:'Чудова робота!',fh:'🎉 Зі святом, люба родино!',rp:'↺ Ще раз',nl:'Далі ➜',fn:'🏆 На карту',tl:'Час',hl:'Підказки',fd:'Знайдено:',nh:'Підказки закінчилися!',sl:'Не поспішай, придивись! 👀',hu:'Золотий промінчик показує шлях! ✨',lk:'Спочатку пройди попередню локацію!',bs:'Рекорд',sp:{mila:'Міла',liza:'Мама Ліза',sasha:'Тато Саша',misha:'Міша'}},
 sk:{t:'Veľké dobrodružstvo Mily',s:'Pomôž Mile, mame Lize, ockovi Sašovi a bračekovi Miškovi nájsť všetky ukryté veci na 15 miestach a stihnúť Veľkú rodinnú oslavu!',p:'▶ Začať dobrodružstvo',mt:'🗺️ Mapa dobrodružstva (15 miest)',bm:'Mapa',ul:'🔓 Odomknúť všetky',ult:'Všetkých 15 miest odomknutých!',nx:'Ďalej ➜',go:'🔍 Hľadať predmety!',wh:'Skvelá práca!',fh:'🎉 Šťastnú oslavu, rodinka!',rp:'↺ Znova',nl:'Ďalej ➜',fn:'🏆 Na mapu',tl:'Čas',hl:'Nápovedy',fd:'Nájdené:',nh:'Nápovedy sa minuli!',sl:'Neponáhľaj sa, rozhliadni sa! 👀',hu:'Zlatý lúč ukazuje smer! ✨',lk:'Najprv dokonči predchádzajúce miesto!',bs:'Rekord',sp:{mila:'Mila',liza:'Mama Liza',sasha:'Ocko Saša',misha:'Miško'}}
};

// === 2. SVG HELPERS ===
const R=(x,y,w,h,f,r=0,s='',sw=0)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}"${s?` stroke="${s}" stroke-width="${sw}"`:''}/>`;
const C=(x,y,r,f,s='',sw=0)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"${s?` stroke="${s}" stroke-width="${sw}"`:''}/>`;
const E=(x,y,rx,ry,f,s='',sw=0)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}"${s?` stroke="${s}" stroke-width="${sw}"`:''}/>`;
const P=(d,f,s='',sw=0)=>`<polygon points="${d}" fill="${f}"${s?` stroke="${s}" stroke-width="${sw}"`:''}/>`;
const Ln=(x1,y1,x2,y2,s,w=2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${s}" stroke-width="${w}" stroke-linecap="round"/>`;

// === 3. CHARACTER PORTRAITS (FROM PHOTOS) & FULL-BODY ===
function port(w){
 if(w==='mila')return`<svg viewBox="0 0 100 100" width="100%" height="100%">${C(50,50,50,'#ffeaf3')}<path d="M18 48C14 70 16 90 25 98H75C84 90 86 70 82 48 82 22 68 14 50 14 32 14 18 22 18 48Z" fill="#dfb368"/><path d="M22 98C24 78 34 74 50 74 66 74 76 78 78 98Z" fill="#fff" stroke="#e2d9eb" stroke-width="1.5"/>${P('58,83 60,79 63,82 66,79 68,83','#f3c65f')}${R(44,65,12,12,'#fde0cf',5)}${E(50,48,22,24,'#ffe6d6')}${E(36,54,4.5,2.5,'#ff9eb5')}${E(64,54,4.5,2.5,'#ff9eb5')}${C(41,47,3.5,'#3a6ea5')}${C(40,46,1.2,'#fff')}${C(59,47,3.5,'#3a6ea5')}${C(58,46,1.2,'#fff')}<path d="M43 59Q50 64 57 59" fill="none" stroke="#d96b82" stroke-width="2.2" stroke-linecap="round"/><path d="M27 42C28 24 40 20 50 20 60 20 72 24 73 42 68 30 60 27 50 27 40 27 32 30 27 42Z" fill="#f0d388"/><path d="M31 27Q50 15 69 27" fill="none" stroke="#e9a4b8" stroke-width="3"/><path d="M37 24L42 15 47 21 50 11 53 21 58 15 63 24" fill="none" stroke="#fff3c4" stroke-width="2"/>${C(50,12,2.2,'#fff')}</svg>`;

// === 6. WEB AUDIO SYNTH (CATCHY LOOPING MELODY + SFX) ===
let AC=null, muted=false, bgmTimer=null, noteIdx=0;
const MEL=[523.25,659.25,783.99,659.25,880,783.99,659.25,587.33,523.25,587.33,659.25,783.99,698.46,659.25,587.33,523.25];
const BAS=[130.81,130.81,196,196,220,220,174.61,196];
function initAudio(){
 if(!AC){const Ctx=window.AudioContext||window.webkitAudioContext;if(Ctx)AC=new Ctx();}
 if(AC&&AC.state==='suspended')AC.resume();
 if(!bgmTimer)bgmTimer=setInterval(playBeat,310);
}
function tone(freq,dur,type='triangle',vol=0.055,delay=0){
 if(muted||!AC)return;
 const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,t);
 g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
 o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02);
}
function playBeat(){
 if(muted||!AC)return;
 tone(MEL[noteIdx%MEL.length],0.26,'triangle',0.042);
 if(noteIdx%2===0)tone(BAS[(noteIdx>>1)%BAS.length],0.45,'sine',0.045);
 noteIdx++;
}
function sfxFound(){initAudio();tone(587.33,.14,'sine',.11,0);tone(783.99,.14,'sine',.11,.08);tone(1046.5,.28,'triangle',.13,.16);}
function sfxWrong(){initAudio();tone(190,.13,'sawtooth',.06,0);tone(150,.15,'sawtooth',.05,.07);}
function sfxHint(){initAudio();[659,784,988,1318].forEach((f,i)=>tone(f,.22,'sine',.09,i*.07));}
function sfxWin(){initAudio();[523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.26,'triangle',.12,i*.11));}
function toggleAudio(){
 muted=!muted;const ic=muted?'🔇':'🔊';
 document.getElementById('b-snd').textContent=ic;document.getElementById('u-msnd').textContent=ic;
 if(!muted)initAudio();
}

 document.getElementById('h-hnt').textContent=HINTS;
 document.getElementById('b-hint').disabled=false;
 const itemsSVG=sc.it.map((a,i)=>{
  const [id,x,y,s,rot]=a;
  return`<g class="h-item" id="hi-${i}" data-i="${i}" transform="translate(${x},${y}) rotate(${rot}) scale(${s})">${C(0,0,26,'transparent')}${IT[id][3]}</g>`;
 }).join('');
 document.getElementById('svg').innerHTML=`<g id="bg-l">${sc.bg()}</g><g id="it-l">${itemsSVG}</g><g id="fx-l" pointer-events="none"></g>`;
 renderTray();
 DLG=sc.d; DI=0; document.getElementById('d-mod').classList.add('active'); showDlg();
}
function renderTray(){
 const sc=SC[CUR];
 document.getElementById('tray').innerHTML=sc.it.map((a,i)=>{
  const id=a[0], f=FOUND.has(i);
  return`<div class="chip ${f?'found':''}"><svg class="c-ico" viewBox="-22 -22 44 44">${IT[id][3]}</svg><span>${IT[id][li()]}</span></div>`;
 }).join('');
}
function showDlg(){
 const row=DLG[DI], u=U[L];
 document.getElementById('d-av').innerHTML=port(row[0]);
 document.getElementById('d-spk').textContent=u.sp[row[0]];
 document.getElementById('d-txt').textContent=row[li()+1];
 document.getElementById('d-dot').textContent=`${DI+1} / ${DLG.length}`;
 document.getElementById('d-nxt').textContent=DI===DLG.length-1?u.go:u.nx;
}
function nextDlg(){
 initAudio(); tone(660,.08,'sine',.07);
 if(DI<DLG.length-1){DI++;showDlg();}
 else{document.getElementById('d-mod').classList.remove('active');startTimer();}
}
function startTimer(){
 PLAY=true; clearInterval(TMR);
 TMR=setInterval(()=>{if(PLAY){SEC++;document.getElementById('h-time').textContent=fmt(SEC);}},1000);
}

function findItem(i){
 if(!PLAY||FOUND.has(i))return;
 FOUND.add(i); sfxFound();
 const el=document.getElementById('hi-'+i); if(el)el.classList.add('found');
 const [id,x,y]=SC[CUR].it[i];
 spawnBurst(x,y);
 toast(`${U[L].fd} ${IT[id][li()]} ✨`);
 document.getElementById('h-fnd').textContent=`${FOUND.size}/${SC[CUR].it.length}`;
 renderTray();
 if(FOUND.size===SC[CUR].it.length)setTimeout(winScene,600);
}
function spawnBurst(x,y){
 const fx=document.getElementById('fx-l');
 const g=document.createElementNS('http://www.w3.org/2000/svg','g');
 g.setAttribute('transform',`translate(${x},${y})`);
 g.innerHTML=`<circle r="34" fill="none" stroke="#ffe066" stroke-width="5" class="hring"/>${[0,60,120,180,240,300].map(a=>`<circle cx="${Math.cos(a*Math.PI/180)*28}" cy="${Math.sin(a*Math.PI/180)*28}" r="5" fill="#fff3b0"/>`).join('')}`;
 fx.appendChild(g); setTimeout(()=>g.remove(),900);
}
function spawnWrong(x,y){
 const fx=document.getElementById('fx-l');
 const g=document.createElementNS('http://www.w3.org/2000/svg','g');
 g.setAttribute('transform',`translate(${x},${y})`);
 g.innerHTML=`<circle r="18" fill="none" stroke="#ff6b8b" stroke-width="4" class="hring"/>`;
 fx.appendChild(g); setTimeout(()=>g.remove(),700);
}

function useHint(){
 if(!PLAY)return;
 if(HINTS<=0){toast(U[L].nh);return;}
 const rem=SC[CUR].it.map((_,i)=>i).filter(i=>!FOUND.has(i));
 if(!rem.length)return;
 HINTS--; document.getElementById('h-hnt').textContent=HINTS;
 if(HINTS<=0)document.getElementById('b-hint').disabled=true;
 const pick=rem[Math.floor(Math.random()*rem.length)];
 const [,x,y]=SC[CUR].it[pick];
 sfxHint(); toast(U[L].hu);
 const fx=document.getElementById('fx-l');
 const g=document.createElementNS('http://www.w3.org/2000/svg','g');
 g.setAttribute('transform',`translate(${x},${y})`);
 g.innerHTML=`<circle r="44" fill="rgba(255,224,102,.25)" stroke="#ffd32a" stroke-width="5" class="hring"/><circle r="28" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 5" class="a-sm"/>`;
 fx.appendChild(g); setTimeout(()=>g.remove(),4000);
}

function winScene(){
 PLAY=false; clearInterval(TMR); sfxWin();
 const used=3-HINTS, stars=(SEC<=55&&used===0)?3:(SEC<=110&&used<=1)?2:1;
 SAVE.st[CUR]=Math.max(SAVE.st[CUR]||0,stars);
 SAVE.tm[CUR]=SAVE.tm[CUR]==null?SEC:Math.min(SAVE.tm[CUR],SEC);
 if(CUR+1>=SAVE.u&&CUR+1<SC.length)SAVE.u=CUR+2;
 save();
 const u=U[L], isEnd=CUR===SC.length-1;
 document.getElementById('w-ports').innerHTML=isEnd?['sasha','liza','mila','misha'].map(p=>`<div class="p-badge">${port(p)}</div>`).join(''):`<div class="p-badge main">${port('mila')}</div>`;
 document.getElementById('w-head').textContent=isEnd?u.fh:u.wh;
 document.getElementById('w-st').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
 document.getElementById('w-out').textContent=SC[CUR].o[li()];
 document.getElementById('w-tm').textContent=`⏱️ ${u.tl}: ${fmt(SEC)}`;
 document.getElementById('w-hn').textContent=`💡 ${u.hl}: ${used}/3`;
 document.getElementById('w-nx').textContent=isEnd?u.fn:u.nl;
 document.getElementById('w-mod').classList.add('active');
}
function nextSc(){if(CUR<SC.length-1)loadScene(CUR+1);else openMap();}

// === 8. ZOOM, PAN & TOUCH/CLICK HANDLER ===
function applyV(){
 const maxX=(Z-1)*420, maxY=(Z-1)*260;
 PX=Math.max(-maxX,Math.min(maxX,PX)); PY=Math.max(-maxY,Math.min(maxY,PY));
 document.getElementById('vp').style.transform=`translate(${PX}px,${PY}px) scale(${Z})`;
}
function zStep(d){Z=Math.max(1,Math.min(2.6,Z+d));applyV();}
function resetV(){Z=1;PX=0;PY=0;applyV();}

const stg=document.getElementById('stage'), svgEl=document.getElementById('svg');
let drag=false, moved=0, sx=0, sy=0, px0=0, py0=0, pinch0=0, z0=1;
stg.addEventListener('wheel',e=>{e.preventDefault();zStep(e.deltaY<0?.22:-.22);},{passive:false});
stg.addEventListener('pointerdown',e=>{
 if(!PLAY)return;
 drag=true;moved=0;sx=e.clientX;sy=e.clientY;px0=PX;py0=PY;
});
window.addEventListener('pointermove',e=>{
 if(!drag)return;
 const dx=e.clientX-sx, dy=e.clientY-sy;
 moved=Math.hypot(dx,dy);
 if(Z>1&&moved>4){PX=px0+dx;PY=py0+dy;applyV();}
});
window.addEventListener('pointerup',e=>{
 if(!drag)return; drag=false;
 if(moved<10&&PLAY){
  const hi=e.target.closest&&e.target.closest('.h-item');
  if(hi){findItem(Number(hi.dataset.i));return;}
  if(e.target.closest&&e.target.closest('#svg')){
   sfxWrong();
   const pt=svgEl.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
   const loc=pt.matrixTransform(svgEl.getScreenCTM().inverse());
   spawnWrong(loc.x,loc.y);
   const now=Date.now();CLICKS=CLICKS.filter(t=>now-t<2000);CLICKS.push(now);
   if(CLICKS.length>=4)toast(U[L].sl);
  }
 }
});
stg.addEventListener('touchstart',e=>{if(e.touches.length===2){drag=false;pinch0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);z0=Z;}},{passive:true});
stg.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);Z=Math.max(1,Math.min(2.6,z0*(d/pinch0)));applyV();}},{passive:false});

// INIT
document.getElementById('t-ports').innerHTML=`<div class="p-badge">${port('sasha')}</div><div class="p-badge">${port('liza')}</div><div class="p-badge main">${port('mila')}</div><div class="p-badge">${port('misha')}</div>`;
setLang(L);
</script>
</body>
